      invitee_not_in_create_allowed_groups: "对方不在允许创建专辑的用户组内，不能成为本专辑的 owner。"
      joiner_not_in_teamworker_allowed_groups: "你不在允许成为共同维护者的用户组内，无法接受本条邀请。"
      new_owner_not_in_create_allowed_groups: "你不在允许创建专辑的用户组内，无法接受本次换主邀请。"
      topic_limit_reached: "本专辑收录的主题数量已达上限(%{max})。"
      topic_not_in_collection: "该主题不在本专辑中。"
      note_too_long: "收录备注不能超过 %{max} 个字符。"
      selected_replies_add_remove_overlap: "同一次请求中不能同时精选与取消精选同一个回复。"
