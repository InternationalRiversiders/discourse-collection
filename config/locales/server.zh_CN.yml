      ownership_transfer_teamworker_limit_reached: "换主会再增加一名共同维护者，但本专辑已达换主允许的共同维护者上限(%{max})。请改邀现任共同维护者（升主不会增加共同维护者）。"
      ownership_accept_collection_limit_reached: "你名下专辑数已达上限(%{max})，无法接受这封换主邀请。"
      already_a_maintainer: "该用户已是本专辑的共同维护者。"
      not_a_maintainer: "该用户当前不是本专辑的共同维护者。"
      owner_membership_change_not_allowed: "专辑 owner 不能以共同维护者身份被操作；owner 变更走 type=1 换主邀请。"
      invite_self_not_allowed: "不能向自己发出邀请。"
      already_the_owner: "你已是本专辑的所有者，无需换主。"
      invite_not_pending: "该邀请已不是未决状态。"
      ownership_invite_already_pending: "本专辑已有一条待接受的换主邀请。"
