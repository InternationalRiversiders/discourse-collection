      no_owner: "无主"
      stats:
        topic_count: "话题数"
        subscriber_count: "订阅数"
        teamworker_count: "共同维护者"
    errors:
      name_blank: "专辑名称不能为空。"
      name_out_of_range: "专辑名称长度需在 %{min} 到 %{max} 个字符之间。"
