zh_CN:
  site_settings:
    collection_enabled: "启用公共专辑（淘专辑）功能。"
    collection_allow_anonymous: "允许未登录用户访问公共专辑。关闭时 API 拒绝、前端不显示入口。"
    collection_moderators_can_manage_collections: "允许版主管理其不拥有的专辑：改名称和描述、改 owner。无论此设置如何，管理员始终可管理。用于修正不合规的名称与描述。"
    collection_onebox_enabled: "帖子中的专辑链接独占一行时渲染为卡片，位于句子中间时渲染为带标题的链接。"
    collection_onebox_disabled_categories: "这些分类下的话题不渲染专辑 onebox：卡片与句中链接标题一并抑制。留空表示所有分类都允许。"
    collection_create_allowed_groups: "允许创建专辑的群组。成为现有专辑的新 owner 同样须命中本设置。留空表示任何人都不能创建专辑或成为新 owner。成员资格只在操作发生那一刻判定。"
    collection_teamworker_allowed_groups: "允许成为专辑共同维护者的群组。留空表示任何人都不能被邀为共同维护者。成员资格只在操作发生那一刻判定。"
    collection_create_disallowed_groups: "不允许创建专辑、也不允许成为现有专辑新 owner 的群组；即使命中 {{setting:collection_create_allowed_groups}} 也会被拒绝。留空表示不拒绝任何人。本列表优先于允许组列表。"
    collection_teamworker_disallowed_groups: "不允许成为专辑共同维护者的群组；即使命中 {{setting:collection_teamworker_allowed_groups}} 也会被拒绝。留空表示不拒绝任何人。本列表优先于允许组列表。"
    collection_max_collections_per_user: "单个用户最多可创建的专辑数量。"
    collection_max_topics_per_collection: "单个专辑最多可收录的主题数量。"
    collection_max_teamworkers_per_collection: "每个专辑除创建者外最多可拥有的共同维护者数量。设为 0 表示不允许添加共同维护者。"
    collection_max_selected_replies_per_topic: "专辑阅读页里每个话题随行内联返回的最多精选回复条数。超过时前端经专用端点翻页查看其余。"
    collection_max_owner_collections_per_detail: "专辑详情页内联返回的、该专辑所有者其他专辑的最大数量。超过时前端打开该用户的全部专辑列表。"
    collection_name_min_length: "专辑名称的最小长度（字符数）。"
    collection_name_max_length: "专辑名称的最大长度（字符数）。不能超过 100。"
    collection_description_max_length: "专辑描述的最大长度（字符数）。不能超过 1000。"
    collection_unlimited_teamworkers_role: "选择谁可以在达到 {{setting:collection_max_teamworkers_per_collection}} 后继续添加共同维护者。选择「没有人」即为所有人执行该上限。"
    collection_unlimited_collections_role: "选择谁可以在达到 {{setting:collection_max_collections_per_user}} 后继续创建专辑。选择「没有人」即为所有人执行该上限。"
    collection_invite_validity_days: "邀请（成为共同维护者或 owner）发出后多少天内仍可被接受/拒绝。超过此窗口仍未被受理的邀请不可再接受/拒绝，显示为已过期。不能超过历史保留期，除非历史保留期设为 0（永久保留）。"
    collection_invite_history_days: "邀请记录发出后保留多少天。超过该期限的邀请记录会被清理。设为 0 表示永久保留。其余情况下不能短于受理窗口。"
    collection_topic_added_notification_enabled: "话题被收录进专辑时，向该专辑的订阅者发送通知。关闭后收录话题不再通知任何人，也不会排入发送任务。邀请通知不受影响。"
    errors:
      collection_name_min_length_range: "专辑名称的最小长度不能大于其最大长度。"
      collection_name_max_length_range: "专辑名称的最大长度不能小于其最小长度。"
      collection_invite_validity_days_range: "邀请受理窗口不能长于邀请历史保留期。"
      collection_invite_history_days_range: "邀请历史保留期不能短于邀请受理窗口。"
  discourse_collection:
    # 烘焙期在服务端渲染，故与前端同名卡片文案各存一份（docs/12 §2）。
    onebox:
