en:
  site_settings:
    collection_enabled: "Enable the public Collections feature."
    collection_allow_anonymous: "Allow anonymous users to access collections. When disabled, the API rejects requests and the entry is hidden."
    collection_moderators_can_manage_collections: "Allow moderators to manage collections they do not own: change the name and description, and change the owner. Admins can always do this regardless of this setting. Useful for fixing non-compliant names and descriptions."
    collection_onebox_enabled: "Render a collection card when a post links to a collection on a line of its own, and a titled link when the link sits inside a sentence."
    collection_onebox_disabled_categories: "Categories whose topics never render collection oneboxes: both the card and the titled link are suppressed. Leave empty to allow oneboxes in every category."
    collection_create_allowed_groups: "Groups whose members may create collections. Becoming the owner of an existing collection also requires membership here. Leave empty to disallow creating collections or becoming a new owner for everyone. Membership is only checked when the operation happens."
    collection_teamworker_allowed_groups: "Groups whose members may become co-maintainers of a collection. Leave empty to disallow co-maintainer invitations for everyone. Membership is only checked when the operation happens."
    collection_create_disallowed_groups: "Groups whose members may not create collections or become the owner of an existing collection, even when they are in {{setting:collection_create_allowed_groups}}. Leave empty to disallow no one. This list takes precedence over the allowed groups list."
    collection_teamworker_disallowed_groups: "Groups whose members may not become co-maintainers of a collection, even when they are in {{setting:collection_teamworker_allowed_groups}}. Leave empty to disallow no one. This list takes precedence over the allowed groups list."
    collection_max_collections_per_user: "Maximum number of collections a single user can create."
    collection_max_topics_per_collection: "Maximum number of topics a single collection can contain."
    collection_max_teamworkers_per_collection: "Maximum number of co-maintainers a collection can have, not counting its owner. Set to 0 to disallow co-maintainers."
    collection_max_selected_replies_per_topic: "Maximum number of featured replies returned inline with each topic on a collection reading page. When a topic has more, clients page through the rest via a dedicated endpoint."
    collection_name_min_length: "Minimum collection name length, in characters."
    collection_name_max_length: "Maximum collection name length, in characters. Cannot exceed 100."
    collection_description_max_length: "Maximum collection description length, in characters. Cannot exceed 1000."
    collection_unlimited_teamworkers_role: "Select who may keep adding co-maintainers after reaching {{setting:collection_max_teamworkers_per_collection}}. Choose 'No one' to enforce the limit for everyone."
    collection_unlimited_collections_role: "Select who may keep creating collections after reaching {{setting:collection_max_collections_per_user}}. Choose 'No one' to enforce the limit for everyone."
    collection_invite_validity_days: "How many days an invitation to become a co-maintainer or the owner stays acceptable after it is sent. Once this window passes, a still-unanswered invitation can no longer be accepted or rejected and shows as expired. Cannot exceed the history retention window, unless that is 0 (keep forever)."
    collection_invite_history_days: "How many days invitation records are kept after they are sent. Invitation records older than this are removed. Set to 0 to keep records forever. Otherwise must be at least as long as the validity window."
    errors:
      collection_name_min_length_range: "You cannot set the minimum collection name length above the maximum collection name length."
      collection_name_max_length_range: "You cannot set the maximum collection name length below the minimum collection name length."
      collection_invite_validity_days_range: "You cannot set the invitation validity window longer than the invitation history retention window."
      collection_invite_history_days_range: "You cannot set the invitation history retention window shorter than the invitation validity window."
  discourse_collection:
    # Rendered while cooking a post, i.e. on the server, so these are deliberately not
    # shared with the client-side wordings of the same card (see docs/12 §2).
    onebox:
      inline_title: "%{name} - Collections"
      created_at: "Created"
      last_topic_added_at: "Updated"
      no_topics_yet: "No topics yet"
      no_owner: "Unclaimed"
      stats:
        topic_count: "Topics"
        subscriber_count: "Subscribers"
        teamworker_count: "Maintainers"
    errors:
      name_blank: "A collection name is required."
      name_out_of_range: "Collection name must be between %{min} and %{max} characters."
      description_out_of_range: "Collection description must be at most %{max} characters."
      nothing_to_update: "Provide a name and/or description to update."
      collection_limit_reached: "You have reached the maximum number of collections you can create (%{max})."
      teamworker_limit_reached: "This collection has reached the maximum number of co-maintainers (%{max})."
      ownership_transfer_teamworker_limit_reached: "An ownership transfer would add another co-maintainer, but this collection has already reached its transfer limit (%{max}). Transfer the collection to an existing co-maintainer instead."
      ownership_accept_collection_limit_reached: "You have reached the maximum number of collections you can own (%{max}). You cannot accept this ownership transfer."
      already_a_maintainer: "That user is already a co-maintainer of this collection."
      not_a_maintainer: "That user is not a co-maintainer of this collection."
      owner_membership_change_not_allowed: "The collection owner cannot be managed as a co-maintainer. Ownership changes go through a type=1 ownership invitation."
      invite_self_not_allowed: "You cannot invite yourself to a collection."
      already_the_owner: "You already own this collection."
      invite_not_pending: "This invitation is no longer pending."
      ownership_invite_already_pending: "A pending invitation to become the owner already exists for this collection."
      invite_action_type_invalid: "Invalid invitation type. Use 0 (co-maintainer) or 1 (new owner)."
      invitee_not_in_teamworker_allowed_groups: "That user is not in a group allowed to become a co-maintainer, so they cannot be invited as one."
      invitee_not_in_create_allowed_groups: "That user is not in a group allowed to create collections, so they cannot become the owner of this collection."
      joiner_not_in_teamworker_allowed_groups: "You are not in a group allowed to become a co-maintainer, so you cannot accept this invitation."
      new_owner_not_in_create_allowed_groups: "You are not in a group allowed to create collections, so you cannot accept this ownership transfer."
      topic_limit_reached: "This collection has reached the maximum number of topics (%{max})."
      topic_not_in_collection: "That topic is not in this collection."
      note_too_long: "A collection topic note must be at most %{max} characters."
      selected_replies_add_remove_overlap: "A reply cannot be both featured and unfeatured in the same request."
      selected_reply_cannot_be_first_post: "The first post of a topic cannot be featured as a reply."
      selected_reply_must_be_a_regular_post: "Only regular reply posts can be featured; system and other non-regular entries cannot."
      private_message_topic_not_allowed: "Private message topics cannot be added to a collection."
