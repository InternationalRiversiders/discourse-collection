<?xml version="1.0" encoding="UTF-8"?>
<!--
Custom sprite for the collection plugin. Core globs svg-icons/*.svg from every plugin
root and merges the symbols into the site sprite bundle (SvgSprite.plugin_svgs), so
`d-icon "collection"` resolves anywhere without registering an asset.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <symbol id="collection" viewBox="2 2 20 20">
    <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/>
    <path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 10-2.5-1.5L15 12V4h5v8z"/>
  </symbol>
</svg>
